<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grow Up Me! - ホーム</title>
    <!-- 修正: ../ を削除しました -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 読み込み中画面 -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <p class="loading-title">今日は何する？</p>
            <div class="loading-bar-container">
                <div id="loading-bar" class="loading-bar"></div>
            </div>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div id="app" class="app-container hidden">
        <header class="header">
            <h1 class="game-title">Grow Up Me!</h1>
            <div id="date-display" class="date-display">2026/07/31 (Fri)</div>
        </header>

        <!-- ログイン画面のコンテナ内など、配置したい場所に追加 -->
        <div class="login-image-container">
            <!-- 修正: ../ を削除しました -->
            <img src="home.gif" alt="ホーム画像" class="responsive-home-img">
        </div>

        <main class="main-content">
            <!-- ログインセクション -->
            <section id="login-section" class="login-section">
                <button id="login-btn" class="dot-btn">ログイン</button>
            </section>

            <!-- 8個のアイコン（2列表示） -->
            <nav class="icon-grid">
                <!-- 修正: すべてのリンクから ../ を削除しました -->
                <a href="room.html" class="icon-card">
                    <div class="icon-box">🏠</div>
                    <span>マイルーム</span>
                </a>
                <a href="task.html" class="icon-card">
                    <div class="icon-box">⚔️</div>
                    <span>タスク</span>
                </a>
                <a href="schedule.html" class="icon-card">
                    <div class="icon-box">📅</div>
                    <span>スケジュール</span>
                </a>
                <a href="input.html" class="icon-card">
                    <div class="icon-box">📖</div>
                    <span>インプット</span>
                </a>
                <a href="record.html" class="icon-card">
                    <div class="icon-box">📜</div>
                    <span>記録</span>
                </a>
                <a href="project.html" class="icon-card">
                    <div class="icon-box">🚩</div>
                    <span>プロジェクト</span>
                </a>
                <a href="mypage.html" class="icon-card">
                    <div class="icon-box">👤</div>
                    <span>マイページ</span>
                </a>
                <a href="custom.html" class="icon-card">
                    <div class="icon-box">⚙️</div>
                    <span>カスタム</span>
                </a>
            </nav>
        </main>
    </div>

    <!-- 修正: ../ を削除しました -->
    <script src="script.js"></script>
</body>
</html>
