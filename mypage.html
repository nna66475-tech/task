<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grow Up Me! - マイページ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mypage.css">
</head>
<body>
    <div id="loading-screen" class="loading-screen hidden">
        <img src="aruku.gif" id="loading-aruku" class="loading-aruku hidden" alt="aruku">
        <div class="loading-content">
            <p class="loading-title">今日は何する？</p>
            <div class="loading-bar-container">
                <div id="loading-bar" class="loading-bar"></div>
            </div>
        </div>
    </div>

    <div id="app" class="app-container">
        <!-- ページ共通ナビゲーションメニュー -->
        <div class="top-nav">
            <a href="index.html" class="nav-home-btn">🏠</a>
            <span class="nav-title">マイページ</span>
            <button id="nav-toggle-btn" class="nav-btn">≡</button>
        </div>
        
        <div id="global-menu" class="global-menu hidden">
            <button id="menu-close-btn" class="menu-close-btn">×</button>
            <ul class="menu-list">
                <li><a href="index.html">ホーム</a></li>
                <li><a href="room.html">マイルーム</a></li>
                <li><a href="task.html">タスク一覧・締切</a></li>
                <li><a href="input.html">インプット</a></li>
                <li><a href="record.html">記録</a></li>
                <li><a href="project.html">プロジェクト</a></li>
                <li><a href="mypage.html">マイページ</a></li>
                <li><a href="custom.html">カスタム</a></li>
            </ul>
        </div>

        <main class="main-content">
            <div class="content-box">
                <h2 class="sub-title">ユーザー情報</h2>
                <ul class="dot-list">
                    <li>ログイン連続日数: <span id="login-streak">0</span>日</li>
                    <li>アプリ開始日: <span id="first-login-date">---</span></li>
                </ul>
            </div>

            <div class="content-box">
                <h2 class="sub-title">テーマ設定</h2>
                
                <div class="setting-item">
                    <label>テーマカラー (色コード):</label>
                    <div style="display:flex; gap:8px;">
                        <input type="text" id="theme-color-input" class="dot-input" placeholder="#ffffff" style="flex:1;">
                        <input type="color" id="theme-color-picker" style="width:40px; height:32px;">
                    </div>
                </div>

                <div class="setting-item">
                    <label>フォント:</label>
                    <select id="font-select" class="dot-input" style="width:100%;">
                        <option value="'DotGothic16', monospace">ドットゴシック (標準)</option>
                        <option value="sans-serif">ゴシック体</option>
                        <option value="serif">明朝体</option>
                    </select>
                </div>

                <button id="save-theme-btn" class="dot-btn" style="width:100%; margin-top:12px;">設定を保存</button>
            </div>
            
            <div class="content-box">
                <h2 class="sub-title">アプリ情報</h2>
                <ul class="dot-list">
                    <li>バージョン: 1.0.0</li>
                    <li>開発者: Grow Up Me! 開発チーム</li>
                </ul>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script src="mypage.js"></script>
</body>
</html>
