<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grow Up Me! - スケジュール</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="schedule.css">
</head>
<body>
    <div id="loading-screen" class="loading-screen hidden">
        <img src="aruku.gif" id="loading-aruku" class="loading-aruku hidden" alt="aruku">
        <div class="loading-content">
            <p class="loading-title">今日は何する？</p>
            <div class="loading-bar-container">
                <div id="loading-bar" class="loading-bar"></div>
            </div>
        </div>
    </div>

    <div id="app" class="app-container">
        <!-- ページ共通ナビゲーションメニュー -->
        <div class="top-nav">
            <a href="index.html" class="nav-home-btn">🏠</a>
            <span class="nav-title">スケジュール</span>
            <button id="nav-toggle-btn" class="nav-btn">≡</button>
        </div>
        
        <div id="global-menu" class="global-menu hidden">
            <button id="menu-close-btn" class="menu-close-btn">×</button>
            <ul class="menu-list">
                <li><a href="index.html">ホーム</a></li>
                <li><a href="room.html">マイルーム</a></li>
                <li><a href="task.html">タスク一覧・締切</a></li>
                <li><a href="input.html">インプット</a></li>
                <li><a href="record.html">記録</a></li>
                <li><a href="project.html">プロジェクト</a></li>
                <li><a href="mypage.html">マイページ</a></li>
                <li><a href="custom.html">カスタム</a></li>
            </ul>
        </div>

        <main class="main-content">
            <div class="content-box">
                <div class="calendar-header">
                    <button id="prev-month-btn" class="calendar-nav-btn">◀</button>
                    <h2 id="month-display" class="sub-title" style="margin:0;">2026年 8月</h2>
                    <button id="next-month-btn" class="calendar-nav-btn">▶</button>
                </div>
                
                <div class="calendar-grid">
                    <div class="day-header sun">日</div>
                    <div class="day-header">月</div>
                    <div class="day-header">火</div>
                    <div class="day-header">水</div>
                    <div class="day-header">木</div>
                    <div class="day-header">金</div>
                    <div class="day-header sat">土</div>
                </div>
                
                <div id="calendar-body" class="calendar-grid">
                    <!-- JSで動的生成 -->
                </div>
            </div>

            <div class="content-box">
                <h2 class="sub-title" style="font-size:14px;">選択日のタスク</h2>
                <ul id="selected-day-tasks" class="dot-list">
                    <!-- タップした日のタスクが表示される -->
                </ul>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script src="schedule.js"></script>
</body>
</html>
